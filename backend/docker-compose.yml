services:
  auth-database:
    image: postgres:16-alpine
    container_name: rydex-auth-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-rydex_auth}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-rydex_auth}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?Set AUTH_POSTGRES_PASSWORD in .env}
    ports:
      - "${AUTH_POSTGRES_PORT:-5433}:5432"
    volumes:
      - rydex-auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER:-rydex_auth} -d ${AUTH_POSTGRES_DB:-rydex_auth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  shared-database:
    image: postgres:16-alpine
    container_name: rydex-shared-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rydex}
      POSTGRES_USER: ${POSTGRES_USER:-rydex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rydex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rydex} -d ${POSTGRES_DB:-rydex}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rydex-auth-postgres-data:
  rydex-postgres-data:
