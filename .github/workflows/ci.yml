name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rydex
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/rydex?schema=public
      NEXTAUTH_SECRET: ci-only-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rydex/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend-syntax:
    name: Backend syntax (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - backend/admin-service
          - backend/auth-service
          - backend/booking-service
          - backend/gateway
          - backend/location-service
          - backend/notification-service
          - backend/user-service
          - backend/vendor-service
          - socketServer
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          mapfile -d '' files < <(find "${{ matrix.path }}" -type f -name '*.js' -not -path '*/node_modules/*' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No JavaScript files found under ${{ matrix.path }}"
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
